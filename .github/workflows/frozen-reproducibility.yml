name: Frozen Reproducibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Report Python and pip versions
        run: |
          python --version
          python -m pip --version

      - name: Install canonical environment
        run: python -m pip install -r requirements-dev.txt -c requirements-constraints.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Verify frozen formal bundle
        run: python verify_frozen_bundle.py

      - name: Verify ranking robustness E2
        run: python -B verify_ranking_robustness.py artifacts/phase-5/82239159eecc2067b7b89f9e13b9cf34d36497b8fdd7105e6babbcc2668e9a1e

      - name: Verify Phase 6 publication
        run: python -B verify_publication_bundle.py artifacts/phase-6/publication-v1/1cd6f03c87ff4e909c5b97bd8727a4d5e6b04225ef32f9fc33303ee72f612467

      - name: Run safe test suite
        run: python -m pytest -q

      - name: Confirm tracked checkout is unchanged
        run: git diff --exit-code
